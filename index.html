<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Website</title>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background-color: #080d18;
            color: #e6f4ff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        /* MAIN CARD */
        .card {
            background: #101a2b;
            border: 1px solid #00bfff;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 0 20px rgba(0, 191, 255, 0.15);
            color: #e6f4ff;
            max-width: 600px;
            width: 90%;
            margin: 20px auto;

            transition: transform 0.3s ease,
                        box-shadow 0.3s ease,
                        border-color 0.3s ease;

            animation: borderPulse 3s ease-in-out infinite;
        }

        .card:hover {
            animation-play-state: paused;
            transform: translateY(-6px);
            border-color: #35c9ff;
            box-shadow:
                0 0 10px rgba(0, 191, 255, 0.45),
                0 0 25px rgba(0, 191, 255, 0.25),
                0 12px 30px rgba(0, 0, 0, 0.35);
        }

        /* HEADINGS */
        h1, h2 {
            font-family: "Courier New", monospace;
            font-weight: 600;
            color: #35c9ff;
            text-shadow: 0 0 10px rgba(0, 191, 255, 0.35);
        }

        h1 {
            font-size: 36px;
            margin-bottom: 20px;
        }

        h2 {
            font-size: 26px;
            margin-bottom: 20px;
        }

        /* PARAGRAPHS */
        p {
            font-family: "Courier New", monospace;
            color: #35c9ff;
            text-shadow: 0 0 10px rgba(0, 191, 255, 0.2);
            line-height: 1.6;
            margin: 8px 0;
        }

        /* WELCOME SUBTITLE */
        .subtitle {
            color: #8298ad;
            font-family: monospace;
            letter-spacing: 2px;
            font-size: 12px;
        }

        /* STATUS LABEL */
        .status {
            display: inline-block;
            color: #35c9ff;
            font-family: monospace;
            font-size: 12px;
            letter-spacing: 2px;
            border: 1px solid #167da0;
            border-radius: 20px;
            padding: 8px 12px;
            margin-bottom: 15px;
            box-shadow: 0 0 10px rgba(0, 191, 255, 0.12);
        }

        /* GLOWING DIVIDER */
        .divider {
            border: 0;
            height: 2px;
            background: #35c9ff;
            box-shadow: 0 0 10px #00bfff;
            margin: 20px 0;
        }

        /* JARVIS BUTTON */
        button {
            background: #101a2b;
            color: #35c9ff;
            border: 1px solid #35c9ff;
            padding: 12px 24px;
            border-radius: 8px;
            font-family: "Courier New", monospace;
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 2px;
            cursor: pointer;

            transition: transform 0.25s ease,
                        box-shadow 0.25s ease,
                        background-color 0.25s ease;
        }

        button:hover {
            transform: translateY(-3px);
            background-color: #142b40;
            box-shadow: 0 0 18px rgba(0, 191, 255, 0.55);
        }

        button:focus-visible {
            outline: 2px solid #35c9ff;
            outline-offset: 4px;
        }

        /* JARVIS MESSAGE */
        #jarvis-message {
            color: #35c9ff;
            font-family: "Courier New", monospace;
            font-weight: bold;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(0, 191, 255, 0.7);
            margin-top: 20px;
            min-height: 24px;
        }

        /* PHOTO ALIGNMENT */
        .photos {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin: 25px 0;
        }

        .photos img {
            display: block;
            width: 180px;
            height: 180px;
            max-width: 45%;
            object-fit: cover;
            transition: transform 0.3s ease,
                        filter 0.3s ease;
        }

        /* FIRST PHOTO: CIRCLE */
        .photo-one {
            border-radius: 50%;
        }

        /* SECOND PHOTO: SQUARE */
        .photo-two {
            border-radius: 0;
        }

        .photos img:hover {
            transform: scale(1.04);
            filter: drop-shadow(0 0 12px rgba(0, 191, 255, 0.7));
        }

        /* FOOTER */
        footer {
            margin-top: 40px;
            font-size: 0.9em;
            font-family: "Courier New", monospace;
            color: #35c9ff;
            text-shadow: 0 0 10px rgba(0, 191, 255, 0.2);
            text-align: center;
        }
