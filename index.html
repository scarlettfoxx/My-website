<!DOCTYPE html>
<html>
<head>
<title>Spider's Jarvis System</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
:root {
--bg: #0a0f1c;
--card-bg: rgba(10, 25, 47, 0.85);
--text: #00f0ff;
--heading: #00f0ff;
--border: #00f0ff;
--btn-bg: transparent;
--btn-text: #00f0ff;
}

body.light {
--bg: #e8f4f8;
--card-bg: #ffffff;
--text: #1a3a4a;
--heading: #0a5a6e;
--border: #0a5a6e;
--btn-bg: #0a5a6e;
--btn-text: white;
}

* {
margin: 0;
padding: 0;
box-sizing: border-box;
}

body {
background-color: var(--bg);
font-family: 'Share Tech Mono', monospace;
color: var(--text);
min-height: 100vh;
display: flex;
flex-direction: column;
align-items: center;
padding: 30px 20px;
transition: background-color 0.4s ease;
}

.top-bar {
text-align: center;
margin-bottom: 25px;
letter-spacing: 3px;
font-size: 14px;
opacity: 0.8;
}

.theme-btn {
position: fixed;
top: 20px;
right: 20px;
padding: 10px 18px;
border: 2px solid var(--border);
background: var(--btn-bg);
color: var(--btn-text);
font-family: 'Share Tech Mono', monospace;
font-size: 14px;
cursor: pointer;
border-radius: 4px;
transition: all 0.3s ease;
z-index: 100;
}

.theme-btn:hover {
box-shadow: 0 0 15px var(--border);
}

.activate-btn {
display: inline-block;
padding: 12px 30px;
border: 2px solid #00f0ff;
background: transparent;
color: #00f0ff;
font-family: 'Orbitron', sans-serif;
font-size: 16px;
letter-spacing: 2px;
cursor: pointer;
margin-bottom: 30px;
transition: all 0.3s ease;
border-radius: 4px;
}

.activate-btn:hover {
background: rgba(0, 240, 255, 0.15);
box-shadow: 0 0 20px #00f0ff, 0 0 40px #00f0ff;
}

.card {
background: var(--card-bg);
border: 1px solid var(--border);
border-radius: 12px;
padding: 40px 35px;
max-width: 700px;
width: 100%;
box-shadow: 0 0 30px rgba(0, 240, 255, 0.15);
transition: all 0.4s ease;
}

h1 {
font-family: 'Orbitron', sans-serif;
font-size: 2.4em;
margin-bottom: 10px;
color: var(--heading);
letter-spacing: 2px;
}

.subtitle {
opacity: 0.8;
margin-bottom: 25px;
font-size: 15px;
}

h2 {
font-family: 'Orbitron', sans-serif;
font-size: 1.3em;
margin: 30px 0 12px;
color: var(--heading);
letter-spacing: 1px;
}

p {
line-height: 1.7;
margin-bottom: 8px;
font-size: 15px;
}

.images {
display: flex;
justify-content: center;
gap: 25px;
margin: 35px 0 20px;
flex-wrap: wrap;
}

.images img {
width: 130px;
height: 130px;
border-radius: 50%;
border: 2px solid var(--border);
object-fit: cover;
box-shadow: 0
